<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="雨底之东 · 潮湿档案——以2000年代广州为底色的新怪谈世界观档案库。下雨时，潮底会与现世连通。" />
    <title>雨底之东 · 潮湿档案</title>
    <script>
      // GitHub Pages SPA 回跳：404.html 将原路径存入 sessionStorage 后跳回首页
      ;(function () {
        try {
          var redirect = sessionStorage.getItem('spa-redirect')
          if (redirect) {
            sessionStorage.removeItem('spa-redirect')
            history.replaceState(null, '', redirect)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
