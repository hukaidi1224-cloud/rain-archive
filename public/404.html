<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // SPA fallback for GitHub Pages project sites：
      // 保存原始路径后跳回站点根，由首页脚本 history.replaceState 还原
      ;(function () {
        var base = '/rain-archive'
        var path = window.location.pathname
        if (path.indexOf(base) === 0) path = path.slice(base.length)
        var target = path + window.location.search + window.location.hash
        try {
          sessionStorage.setItem('spa-redirect', target || '/')
        } catch (e) {}
        window.location.replace(base + '/')
      })()
    </script>
  </head>
  <body></body>
</html>
